<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mudisGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d9251d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f89820;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5b4fa8;stop-opacity:1" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softglow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="orbit3" d="M 400,80 A 120,120 0 1,1 399.9,80" fill="none"/>
    <path id="orbit1" d="M 400,110 A 90,90 0 1,1 399.9,110" fill="none"/>
    <path id="orbit2" d="M 400,145 A 55,55 0 1,0 399.9,145" fill="none"/>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#0d0d0d"/>

  <!-- Orbiting particles -->
  <g filter="url(#softglow)">
    <circle r="4" fill="#d9251d" opacity="0.95">
      <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#orbit3"/></animateMotion>
    </circle>
    <circle r="3" fill="#ff4d4d" opacity="0.7">
      <animateMotion dur="5s" begin="2.5s" repeatCount="indefinite"><mpath href="#orbit3"/></animateMotion>
    </circle>
    <circle r="4" fill="#f89820" opacity="0.95">
      <animateMotion dur="3.5s" repeatCount="indefinite"><mpath href="#orbit1"/></animateMotion>
    </circle>
    <circle r="3" fill="#f89820" opacity="0.7">
      <animateMotion dur="3.5s" begin="1.17s" repeatCount="indefinite"><mpath href="#orbit1"/></animateMotion>
    </circle>
    <circle r="3" fill="#ffc34d" opacity="0.65">
      <animateMotion dur="3.5s" begin="2.33s" repeatCount="indefinite"><mpath href="#orbit1"/></animateMotion>
    </circle>
    <circle r="3.5" fill="#5b4fa8" opacity="0.95">
      <animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#orbit2"/></animateMotion>
    </circle>
    <circle r="3" fill="#7b6dc9" opacity="0.8">
      <animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#orbit2"/></animateMotion>
    </circle>
  </g>

  <!-- Main title -->
  <text x="400" y="215" font-family="system-ui, -apple-system, sans-serif"
        font-size="80" font-weight="200" letter-spacing="-3"
        fill="url(#mudisGradient)" text-anchor="middle" filter="url(#glow)">Mudis</text>

  <!-- Single combined icon: cylinder with broadcast wave on top, centered below text -->
  <g transform="translate(400, 268)" filter="url(#softglow)">
    <!-- Broadcast arc (coming from top of cylinder) -->
    <path d="M -13,-22 A 16,16 0 0,1 13,-22" fill="none" stroke="#7b6dc9" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
    <path d="M -20,-30 A 24,24 0 0,1 20,-30" fill="none" stroke="#5b4fa8" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>

    <!-- Cylinder top ellipse -->
    <ellipse cx="0" cy="-12" rx="14" ry="4.5" fill="#0d0d0d" stroke="#f89820" stroke-width="1.5"/>
    <!-- Cylinder body -->
    <rect x="-14" y="-12" width="28" height="20" fill="#0d0d0d" stroke="#f89820" stroke-width="1.5"/>
    <!-- Cylinder bottom ellipse -->
    <ellipse cx="0" cy="8" rx="14" ry="4.5" fill="#0d0d0d" stroke="#f89820" stroke-width="1.5"/>
    <!-- Inner stack line -->
    <line x1="-14" y1="-3" x2="14" y2="-3" stroke="#f89820" stroke-width="1" opacity="0.4"/>
  </g>

</svg>
