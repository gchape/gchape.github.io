<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clojureGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5881d8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#63b132;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#91dc47;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#0a0a0a"/>
  
  <!-- Data flow rings (representing reactive streams) -->
  <g opacity="0.3" stroke="url(#clojureGradient)" fill="none" stroke-width="2">
    <circle cx="400" cy="200" r="100">
      <animate attributeName="r" values="100;120;100" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="200" r="120">
      <animate attributeName="r" values="120;140;120" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.05;0.2" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="200" r="140">
      <animate attributeName="r" values="140;160;140" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.02;0.15" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Flowing particles (representing data streams) -->
  <g fill="#63b132" opacity="0.6">
    <circle cx="400" cy="200" r="3">
      <animateTransform attributeName="transform" type="rotate" 
        from="0 400 200" to="360 400 200" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="400;480;400" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="200" r="3">
      <animateTransform attributeName="transform" type="rotate" 
        from="120 400 200" to="480 400 200" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="400;480;400" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="200" r="3">
      <animateTransform attributeName="transform" type="rotate" 
        from="240 400 200" to="600 400 200" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="400;480;400" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Text with glow effect -->
  <text x="400" y="215" font-family="system-ui, -apple-system, sans-serif" 
        font-size="72" font-weight="300" letter-spacing="-2"
        fill="url(#clojureGradient)" text-anchor="middle" filter="url(#glow)">OpusDB</text>
</svg>